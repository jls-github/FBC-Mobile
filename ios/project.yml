name: FBCEnumclaw
options:
  bundleIdPrefix: org.fbcenumclaw
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
settings:
  SWIFT_VERSION: "5.9"
  PRODUCT_BUNDLE_IDENTIFIER: org.fbcenumclaw.app
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
targets:
  FBCEnumclaw:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - FBCEnumclaw
    info:
      path: FBCEnumclaw/Info.plist
      properties:
        CFBundleName: FBC Enumclaw
        CFBundleDisplayName: FBC Enumclaw
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: LaunchScreen
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    settings:
      INFOPLIST_FILE: FBCEnumclaw/Info.plist
      CODE_SIGN_STYLE: Automatic
    pods:
      - HotwireNative
schemes:
  FBCEnumclaw:
    build:
      targets:
        FBCEnumclaw: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
